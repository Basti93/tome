# T.O.M.E. - Apache vhost fuer training.ssc-landau.de (neue Version, Laravel 13 + Vue 3)
#
# Ersetzt /etc/apache2/sites-available/training.conf (siehe deploy/server-setup.sh, Abschnitt "Vhost").
# Benoetigte Module: ssl proxy proxy_fcgi headers rewrite alias dir setenvif deflate mime
#
# Verzeichnislayout:
#   /var/www/tome-app/current            -> Symlink auf releases/<ts>-<sha>
#   /var/www/tome-app/current/app-dist   -> gebaute Vue-App (DocumentRoot)
#   /var/www/tome-app/current/server/public/index.php -> Laravel Front Controller
#   /var/www/tome-app/shared/storage     -> persistente Uploads/Logs (nicht im Release)
#
# URL-Schema:
#   /                SPA (Fallback auf index.html fuer Deep Links)
#   /api/v1/...      Laravel. Der Pfad bleibt UNVERAENDERT erhalten (REQUEST_URI = /api/v1/...),
#                    siehe ProxyPassMatch weiter unten.
#   /api/storage/... Dateien aus shared/storage/app/public (keine Skripte, kein Listing)
#   /api/api/...     Alte App-Version -> 410 JSON
#
# Optional: Matomo-Origin fuer die CSP (z.B. "https://matomo.example.org"). Ohne Matomo bleibt
# der Platzhalter "'self'" (ein leerer Define-Wert waere in Apache "undefiniert").
Define TOME_MATOMO_ORIGIN "'self'"
Define TOME_ROOT /var/www/tome-app
Define TOME_FPM_SOCKET /run/php/php8.4-fpm-tome.sock

<VirtualHost *:80>
    ServerName training.ssc-landau.de
    ServerAlias www.training.ssc-landau.de
    # Let's-Encrypt-HTTP-01 laeuft ueber den Redirect wie bisher (certbot folgt Redirects).
    Redirect permanent / https://training.ssc-landau.de/
</VirtualHost>

<VirtualHost *:443>
    ServerName training.ssc-landau.de
    ServerAlias www.training.ssc-landau.de
    ServerAdmin bindersebastian@online.de

    DocumentRoot ${TOME_ROOT}/current/app-dist

    ErrorLog ${APACHE_LOG_DIR}/tome-error.log
    CustomLog ${APACHE_LOG_DIR}/tome-access.log combined

    # ------------------------------------------------------------------ SPA
    <Directory ${TOME_ROOT}/current/app-dist>
        # current ist ein Symlink -> FollowSymLinks noetig
        Options -Indexes +FollowSymLinks -ExecCGI -Includes -MultiViews
        AllowOverride None
        Require all granted

        # SPA-Fallback: alles, was keine Datei ist, liefert index.html (Vue Router, History-Mode)
        FallbackResource /index.html

        # Standard: nie cachen ohne Revalidierung (index.html, Service Worker, manifest.json)
        Header set Cache-Control "no-cache"

        # Versteckte Dateien nie ausliefern
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # Gehashte Build-Dateien: ein 404 darf NICHT index.html liefern; lange cachen
    <Directory ${TOME_ROOT}/current/app-dist/assets>
        FallbackResource disabled
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Bilder/Icons: nicht gehasht, aber selten geaendert
    <Directory ${TOME_ROOT}/current/app-dist/img>
        FallbackResource disabled
        Header set Cache-Control "public, max-age=86400"
    </Directory>

    # ------------------------------------------------------------------ API-Routing
    # Laravel muss den vollstaendigen Pfad /api/v1/... sehen. Ein "Alias /api .../public" wuerde
    # den Pfad auf /v1/... verkuerzen (Laravel-Basispfad /api). Deshalb: ProxyPassMatch auf
    # den Front Controller. SCRIPT_FILENAME wird aus dem Ziel gebildet (public/index.php),
    # REQUEST_URI bleibt die urspruengliche URL -> Laravel routet /api/v1/... mit apiPrefix "api".
    #
    # Reihenfolge ist wichtig (erster Treffer gewinnt): erst die Ausnahmen, dann die API.
    ProxyPass /api/storage !
    ProxyPass /api/api !
    ProxyPassMatch "^/api(/.*)?$" "unix:${TOME_FPM_SOCKET}|fcgi://localhost${TOME_ROOT}/current/server/public/index.php" timeout=60

    # Authorization-Header an PHP durchreichen (JWT)
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    # ------------------------------------------------------------------ Uploads
    Alias /api/storage ${TOME_ROOT}/shared/storage/app/public
    <Directory ${TOME_ROOT}/shared/storage/app/public>
        Options None
        AllowOverride None
        Require all granted
        # reine Dateiauslieferung: kein Handler, keine Skripte
        SetHandler default-handler
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|pht|inc|cgi|pl|py|sh|shtml|asp|aspx|jsp)(\.|$)">
            Require all denied
        </FilesMatch>
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
        # Hochgeladene Dateien duerfen im Browser nichts ausfuehren (auch kein SVG-Script)
        Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'"
        Header set Cache-Control "public, max-age=86400"
    </Directory>

    # ------------------------------------------------------------------ Alte App-Version
    # Die alte Vue-2-App ruft /api/api/... auf. Unabhaengig von Laravel: 410 + JSON.
    ErrorDocument 410 "{\"message\":\"Diese App-Version ist veraltet. Bitte Seite neu laden.\"}"
    <Location "/api/api">
        RewriteEngine On
        RewriteRule ^ - [G,NS]
        Header always set Content-Type "application/json; charset=utf-8"
        Header always set Cache-Control "no-store"
    </Location>

    # ------------------------------------------------------------------ Kompression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript text/javascript application/json image/svg+xml
    </IfModule>

    # ------------------------------------------------------------------ Sicherheits-Header
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # CSP, abgeleitet aus dem gebauten Bundle:
    #  - script-src 'self': index.html enthaelt kein Inline-Script (Vite-Module)
    #  - style-src 'unsafe-inline': Vuetify setzt Inline-Styles und ein <style> fuer das Theme
    #  - connect-src: Firebase Cloud Messaging (Installations + FCM Registrations), optional Matomo
    #  - img-src data:/blob: fuer Avatare/Vorschauen; Uploads kommen von 'self' (/api/storage)
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' ${TOME_MATOMO_ORIGIN}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${TOME_MATOMO_ORIGIN}; font-src 'self' data:; connect-src 'self' https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://fcm.googleapis.com ${TOME_MATOMO_ORIGIN}; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    # ------------------------------------------------------------------ TLS (wie bisher)
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/ssc-landau.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ssc-landau.de/privkey.pem
</VirtualHost>
