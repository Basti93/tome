# Platzhalter fuer die WordPress-Seite (muss durch das TOME-Setup unberuehrt bleiben)
<VirtualHost *:443>
    ServerName ssc-landau.de
    DocumentRoot /var/www/wp-website
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ssc-landau.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ssc-landau.de/privkey.pem
</VirtualHost>
