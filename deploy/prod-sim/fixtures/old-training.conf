<VirtualHost *:80>
ServerName training.ssc-landau.de
Redirect / https://training.ssc-landau.de
</VirtualHost>
<VirtualHost *:443>
	ServerName training.ssc-landau.de
	ServerAlias www.training.ssc-landau.de
	ServerAdmin bindersebastian@online.de
	DocumentRoot /var/www/tome
        Alias /api /var/www/tome/api/public
    <Directory /var/www/tome/api/public>
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
        </FilesMatch>
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/ssc-landau.de/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/ssc-landau.de/privkey.pem
</VirtualHost>
