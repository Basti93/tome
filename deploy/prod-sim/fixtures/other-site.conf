# Platzhalter fuer eine andere Seite auf dem Server (muss durch das TOME-Setup unberuehrt bleiben)
<VirtualHost *:443>
    ServerName example.org
    DocumentRoot /var/www/other-site
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.org/privkey.pem
</VirtualHost>
